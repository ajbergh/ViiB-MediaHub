name: Refresh Remediation Lockfiles

on:
  push:
    branches: [agent/full-remediation]
    paths:
      - package.json
      - backend/go.mod
      - .github/workflows/refresh-remediation-lockfiles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache-dependency-path: backend/go.sum
      - name: Refresh npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Refresh Go module metadata
        working-directory: backend
        run: go mod tidy
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/go.mod backend/go.sum
          if ! git diff --cached --quiet; then
            git commit -m "Refresh remediation dependency locks"
            git push origin HEAD:agent/full-remediation
          fi
