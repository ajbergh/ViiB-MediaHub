name: Apply full reliability remediation
# A second branch push intentionally triggers this workflow after its initial creation.

on:
  push:
    branches:
      - agent/full-reliability-remediation

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip agent]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-reliability-remediation
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic remediation
        run: python scripts/apply_full_reliability_remediation.py

      - name: Format Go sources
        working-directory: backend
        run: gofmt -w internal/api internal/db internal/scanner

      - name: Commit and push implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Implement full reliability remediation [skip agent]"
            git push origin HEAD:agent/full-reliability-remediation
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Frontend validation
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: backend/go.sum

      - name: Install native tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev

      - name: Prepare embedded build fixtures
        working-directory: backend
        shell: bash
        run: |
          mkdir -p cmd/viib/dist cmd/wails/frontend/dist cmd/wails/build .ci
          printf '<!doctype html><title>test fixture</title>' > cmd/viib/dist/index.html
          cp cmd/viib/dist/index.html cmd/wails/frontend/dist/index.html
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > cmd/wails/build/appicon.png

      - name: Backend validation
        working-directory: backend
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
