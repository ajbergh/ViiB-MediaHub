name: Generate Final Cleanup

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache-dependency-path: backend/go.sum
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev
      - name: Generate and format cleanup
        run: |
          python3 scripts/final_remediation_cleanup.py
          find backend -name '*.go' -print0 | xargs -0 gofmt -w
      - name: Prepare embedded test fixtures
        working-directory: backend
        run: |
          mkdir -p cmd/viib/dist cmd/wails/frontend/dist cmd/wails/build
          printf '<!doctype html><title>test fixture</title>' > cmd/viib/dist/index.html
          cp cmd/viib/dist/index.html cmd/wails/frontend/dist/index.html
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > cmd/wails/build/appicon.png
      - name: Validate generated cleanup
        run: |
          npm ci
          npm run typecheck
          npm test
          cd backend
          go test ./...
          go vet ./...
      - name: Commit validated source set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/cmd/viib/main.go \
            backend/cmd/wails/main.go \
            backend/internal/api/api.go \
            backend/internal/api/download_manager.go \
            backend/internal/mediafetch/mediafetch.go \
            backend/internal/scanner/lifecycle.go \
            backend/internal/scanner/scanner.go \
            backend/internal/server/server.go \
            services/backendService.ts \
            store.ts \
            types.ts
          git commit -m "Complete lifecycle identity and SSRF remediation"
          git push origin HEAD:agent/full-remediation
