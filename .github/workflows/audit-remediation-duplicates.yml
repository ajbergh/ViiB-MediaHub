name: Audit Remediation Duplicates

on:
  push:
    branches: [agent/full-remediation]
    paths:
      - .github/workflows/audit-remediation-duplicates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0
      - name: Scan changed source files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'main...HEAD'], text=True
          ).splitlines()
          extensions = {'.go', '.ts', '.tsx', '.js', '.mjs', '.yml', '.yaml'}
          report = []
          for name in changed:
              path = Path(name)
              if path.suffix not in extensions or not path.exists():
                  continue
              lines = path.read_text(errors='replace').splitlines()
              i = 0
              while i < len(lines):
                  found = None
                  for size in range(min(20, (len(lines) - i) // 2), 0, -1):
                      left = lines[i:i+size]
                      right = lines[i+size:i+2*size]
                      if left == right and any(line.strip() for line in left):
                          found = (size, left)
                          break
                  if found:
                      size, block = found
                      report.append(f'{name}:{i+1}: adjacent duplicate block ({size} lines)')
                      report.extend(f'    {line}' for line in block[:8])
                      if size > 8:
                          report.append('    ...')
                      i += size * 2
                  else:
                      i += 1
          Path('duplicate-audit.txt').write_text('\n'.join(report) + ('\n' if report else 'No adjacent duplicate blocks found.\n'))
          print(Path('duplicate-audit.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remediation-duplicate-audit
          path: duplicate-audit.txt
          retention-days: 7
