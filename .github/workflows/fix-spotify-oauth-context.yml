name: Fix Spotify OAuth Context

on:
  push:
    branches: [agent/full-remediation]
    paths:
      - .github/workflows/fix-spotify-oauth-context.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0
      - name: Repair cross-origin OAuth context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Backend credential envelope: persist transient PKCE context across origins.
          path = Path('backend/internal/api/spotify.go')
          text = path.read_text()
          old = '''type SpotifyCredentials struct {
          \tClientId     string `json:"clientId"`     // OAuth client ID from Spotify Developer Dashboard
          \tClientSecret string `json:"clientSecret"` // OAuth client secret (stored server-side for security)
          \tAccessToken  string `json:"accessToken"`  // OAuth access token (expires in 1 hour)
          \tRefreshToken string `json:"refreshToken"` // OAuth refresh token (used to get new access tokens)
          \tExpiry       int64  `json:"expiry"`       // Unix timestamp when access token expires
          \tCodeVerifier string `json:"codeVerifier"` // PKCE code verifier (used during auth flow)
          }'''
          new = '''type SpotifyCredentials struct {
          \tClientId     string `json:"clientId"`     // OAuth public client ID
          \tClientSecret string `json:"clientSecret"` // Legacy field; never returned to the renderer
          \tAccessToken  string `json:"accessToken"`
          \tRefreshToken string `json:"refreshToken"`
          \tExpiry       int64  `json:"expiry"`
          \tCodeVerifier string `json:"codeVerifier,omitempty"`
          \tOAuthState   string `json:"oauthState,omitempty"`
          \tRedirectURI  string `json:"redirectUri,omitempty"`
          }'''
          if old not in text:
              raise SystemExit('SpotifyCredentials struct anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('\tcreds.ClientSecret = ""\n\tcreds.ClientSecret = ""\n', '\tcreds.ClientSecret = ""\n', 1)
          path.write_text(text)

          # Frontend API contract.
          path = Path('services/api.ts')
          text = path.read_text()
          old_type = '{ clientId: string; clientSecret: string; accessToken: string; refreshToken: string; expiry: number; codeVerifier?: string }'
          new_type = '{ clientId: string; clientSecret: string; accessToken: string; refreshToken: string; expiry: number; codeVerifier?: string; oauthState?: string; redirectUri?: string }'
          if text.count(old_type) != 2:
              raise SystemExit(f'expected two Spotify credential type anchors, found {text.count(old_type)}')
          text = text.replace(old_type, new_type)
          path.write_text(text)

          # Login page: store the complete one-time auth context server-side for Wails.
          path = Path('pages/Spotify.tsx')
          text = path.read_text()
          old = '''                    expiry: 0,
                              codeVerifier: codeVerifier // Save verifier for cross-origin callback
                          };'''
          new = '''                    expiry: 0,
                              codeVerifier,
                              oauthState: state,
                              redirectUri
                          };'''
          if old not in text:
              raise SystemExit('Spotify pre-save anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace("        localStorage.setItem('spotify_oauth_state', state);\n        localStorage.setItem('spotify_oauth_state', state);\n", "        localStorage.setItem('spotify_oauth_state', state);\n", 1)
          path.write_text(text)

          # Callback: validate state only after loading cross-origin fallback context.
          path = Path('pages/SpotifyCallback.tsx')
          text = path.read_text()
          text = text.replace(
              'const { spotifyClientId, spotifyClientSecret, setSpotifyTokens, setSpotifyUser, addLog } = useStore();',
              'const { spotifyClientId, setSpotifyTokens, setSpotifyUser, addLog } = useStore();',
              1,
          )
          text = text.replace(
              "        const expectedState = localStorage.getItem('spotify_oauth_state');",
              "        const storedState = localStorage.getItem('spotify_oauth_state');",
              1,
          )
          validation = '''        if (!returnedState || !expectedState || returnedState !== expectedState) {
                      setStatus('error');
                      setErrorMsg('OAuth state validation failed. Please try connecting again.');
                      return;
                  }

          '''
          if text.count(validation) != 2:
              raise SystemExit(f'expected two duplicate callback validations, found {text.count(validation)}')
          text = text.replace(validation + validation, '', 1)

          pattern = re.compile(r'''                // Get credentials - try Zustand first, fall back to backend API.*?                if \(!clientId\) \{
                              throw new Error\("Missing Spotify Client ID\. Please configure it in Settings\."\);
                          \}

                          // Get the redirect URI that was used to initiate the auth flow.*?                if \(!codeVerifier\) \{
                              throw new Error\("Missing code verifier\. Please try logging in again\."\);
                          \}
''', re.S)
          replacement = '''                // Load the one-time OAuth context from the current origin first, then
                          // fall back to the encrypted backend envelope for Wails cross-origin callbacks.
                          let clientId = spotifyClientId;
                          let expectedState = storedState;
                          let redirectUri = localStorage.getItem('spotify_redirect_uri');
                          let codeVerifier = localStorage.getItem('spotify_code_verifier');

                          if (!clientId || !expectedState || !redirectUri || !codeVerifier) {
                              try {
                                  const creds = await api.getSpotifyCredentials();
                                  if (!clientId && creds?.clientId) clientId = creds.clientId;
                                  if (!expectedState && creds?.oauthState) expectedState = creds.oauthState;
                                  if (!redirectUri && creds?.redirectUri) redirectUri = creds.redirectUri;
                                  if (!codeVerifier && creds?.codeVerifier) codeVerifier = creds.codeVerifier;
                              } catch (e) {
                                  console.error('[SpotifyCallback] Failed to load backend OAuth context:', e);
                              }
                          }

                          if (!returnedState || !expectedState || returnedState !== expectedState) {
                              throw new Error('OAuth state validation failed. Please try connecting again.');
                          }
                          if (!clientId) {
                              throw new Error('Missing Spotify Client ID. Please configure it in Settings.');
                          }
                          if (!redirectUri) {
                              redirectUri = `${window.location.origin}/callback`;
                          }
                          if (!codeVerifier) {
                              throw new Error('Missing code verifier. Please try logging in again.');
                          }
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'callback context block replacement count: {count}')

          text = text.replace("                localStorage.removeItem('spotify_oauth_state');\n                localStorage.removeItem('spotify_oauth_state');\n", "                localStorage.removeItem('spotify_oauth_state');\n", 1)
          text = text.replace(
              '''                        clientId: clientId,
                                      clientSecret: clientSecret,
                                      accessToken: data.access_token,
                                      refreshToken: data.refresh_token,
                                      expiry: expiry
                                  });''',
              '''                        clientId,
                                      clientSecret: '',
                                      accessToken: data.access_token,
                                      refreshToken: data.refresh_token,
                                      expiry,
                                      codeVerifier: '',
                                      oauthState: '',
                                      redirectUri: ''
                                  });''',
              1,
          )
          text = text.replace(
              '[searchParams, spotifyClientId, spotifyClientSecret, setSpotifyTokens, setSpotifyUser, addLog, navigate]',
              '[searchParams, spotifyClientId, setSpotifyTokens, setSpotifyUser, addLog, navigate]',
              1,
          )
          path.write_text(text)
          PY
          gofmt -w backend/internal/api/spotify.go
      - name: Commit OAuth repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/api/spotify.go services/api.ts pages/Spotify.tsx pages/SpotifyCallback.tsx
          git commit -m "Fix cross-origin Spotify OAuth state validation"
          git push origin HEAD:agent/full-remediation
