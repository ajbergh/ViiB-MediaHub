name: Fix Spotify OAuth Context

on:
  push:
    branches: [agent/full-remediation]
    paths:
      - .github/workflows/fix-spotify-oauth-context.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0
      - name: Repair cross-origin OAuth context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Backend credential envelope.
          path = Path('backend/internal/api/spotify.go')
          text = path.read_text()
          text, count = re.subn(
              r'type SpotifyCredentials struct \{.*?\n\}',
              '''type SpotifyCredentials struct {
          \tClientId     string `json:"clientId"`     // OAuth public client ID
          \tClientSecret string `json:"clientSecret"` // Legacy field; never returned to the renderer
          \tAccessToken  string `json:"accessToken"`
          \tRefreshToken string `json:"refreshToken"`
          \tExpiry       int64  `json:"expiry"`
          \tCodeVerifier string `json:"codeVerifier,omitempty"`
          \tOAuthState   string `json:"oauthState,omitempty"`
          \tRedirectURI  string `json:"redirectUri,omitempty"`
          }''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'SpotifyCredentials replacement count: {count}')
          text = text.replace('\tcreds.ClientSecret = ""\n\tcreds.ClientSecret = ""\n', '\tcreds.ClientSecret = ""\n')
          path.write_text(text)

          # Frontend API contract.
          path = Path('services/api.ts')
          text = path.read_text()
          old_type = '{ clientId: string; clientSecret: string; accessToken: string; refreshToken: string; expiry: number; codeVerifier?: string }'
          new_type = '{ clientId: string; clientSecret: string; accessToken: string; refreshToken: string; expiry: number; codeVerifier?: string; oauthState?: string; redirectUri?: string }'
          if old_type not in text:
              raise SystemExit('Spotify credential TypeScript contract anchor missing')
          text = text.replace(old_type, new_type)
          path.write_text(text)

          # Login page: save complete one-time context to backend.
          path = Path('pages/Spotify.tsx')
          text = path.read_text()
          text = text.replace(
              '                    codeVerifier: codeVerifier // Save verifier for cross-origin callback\n',
              '                    codeVerifier,\n                    oauthState: state,\n                    redirectUri\n',
              1,
          )
          text = text.replace(
              "        localStorage.setItem('spotify_oauth_state', state);\n        localStorage.setItem('spotify_oauth_state', state);\n",
              "        localStorage.setItem('spotify_oauth_state', state);\n",
          )
          if 'oauthState: state' not in text or 'redirectUri' not in text:
              raise SystemExit('Spotify login context was not added')
          path.write_text(text)

          # Callback: defer validation until cross-origin backend context is loaded.
          path = Path('pages/SpotifyCallback.tsx')
          text = path.read_text()
          text = text.replace(
              'const { spotifyClientId, spotifyClientSecret, setSpotifyTokens, setSpotifyUser, addLog } = useStore();',
              'const { spotifyClientId, setSpotifyTokens, setSpotifyUser, addLog } = useStore();',
              1,
          )
          text = text.replace(
              "        const expectedState = localStorage.getItem('spotify_oauth_state');",
              "        const storedState = localStorage.getItem('spotify_oauth_state');",
              1,
          )
          text = re.sub(
              r"        if \(!returnedState \|\| !expectedState \|\| returnedState !== expectedState\) \{\n            setStatus\('error'\);\n            setErrorMsg\('OAuth state validation failed\. Please try connecting again\.'\);\n            return;\n        \}\n\n",
              '',
              text,
          )

          start_marker = '                // Get credentials - try Zustand first, fall back to backend API'
          end_marker = '                // Exchange Code'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'callback block markers missing: start={start}, end={end}')
          context_block = '''                // Load the one-time OAuth context from this origin first, then
                          // fall back to the encrypted backend envelope for Wails callbacks.
                          let clientId = spotifyClientId;
                          let expectedState = storedState;
                          let redirectUri = localStorage.getItem('spotify_redirect_uri');
                          let codeVerifier = localStorage.getItem('spotify_code_verifier');

                          if (!clientId || !expectedState || !redirectUri || !codeVerifier) {
                              try {
                                  const creds = await api.getSpotifyCredentials();
                                  if (!clientId && creds?.clientId) clientId = creds.clientId;
                                  if (!expectedState && creds?.oauthState) expectedState = creds.oauthState;
                                  if (!redirectUri && creds?.redirectUri) redirectUri = creds.redirectUri;
                                  if (!codeVerifier && creds?.codeVerifier) codeVerifier = creds.codeVerifier;
                              } catch (e) {
                                  console.error('[SpotifyCallback] Failed to load backend OAuth context:', e);
                              }
                          }

                          if (!returnedState || !expectedState || returnedState !== expectedState) {
                              throw new Error('OAuth state validation failed. Please try connecting again.');
                          }
                          if (!clientId) {
                              throw new Error('Missing Spotify Client ID. Please configure it in Settings.');
                          }
                          if (!redirectUri) {
                              redirectUri = `${window.location.origin}/callback`;
                          }
                          if (!codeVerifier) {
                              throw new Error('Missing code verifier. Please try logging in again.');
                          }

          '''
          text = text[:start] + context_block + text[end:]
          text = text.replace(
              "                localStorage.removeItem('spotify_oauth_state');\n                localStorage.removeItem('spotify_oauth_state');\n",
              "                localStorage.removeItem('spotify_oauth_state');\n",
          )
          text, count = re.subn(
              r'''await api\.saveSpotifyCredentials\(\{\n\s*clientId: clientId,\n\s*clientSecret: clientSecret,\n\s*accessToken: data\.access_token,\n\s*refreshToken: data\.refresh_token,\n\s*expiry: expiry\n\s*\}\);''',
              '''await api.saveSpotifyCredentials({
                                      clientId,
                                      clientSecret: '',
                                      accessToken: data.access_token,
                                      refreshToken: data.refresh_token,
                                      expiry,
                                      codeVerifier: '',
                                      oauthState: '',
                                      redirectUri: ''
                                  });''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'callback credential save replacement count: {count}')
          text = text.replace(
              '[searchParams, spotifyClientId, spotifyClientSecret, setSpotifyTokens, setSpotifyUser, addLog, navigate]',
              '[searchParams, spotifyClientId, setSpotifyTokens, setSpotifyUser, addLog, navigate]',
              1,
          )
          if 'spotifyClientSecret' in text:
              raise SystemExit('callback still references spotifyClientSecret')
          path.write_text(text)
          PY
          gofmt -w backend/internal/api/spotify.go
      - name: Commit OAuth repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/api/spotify.go services/api.ts pages/Spotify.tsx pages/SpotifyCallback.tsx
          git commit -m "Fix cross-origin Spotify OAuth state validation"
          git push origin HEAD:agent/full-remediation
