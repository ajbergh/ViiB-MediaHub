name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run frontend checks
        id: frontend_checks
        continue-on-error: true
        shell: bash
        run: npm run check > frontend-validation.txt 2>&1
      - name: Upload frontend validation log
        if: ${{ steps.frontend_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-log
          path: frontend-validation.txt
          retention-days: 7
      - name: Fail unsuccessful frontend checks
        if: ${{ steps.frontend_checks.outcome == 'failure' }}
        run: exit 1
      # Block releases on vulnerabilities in dependencies shipped with the app.
      # Development-only tooling remains pinned by package-lock.json and should
      # be remediated separately without blocking an unrelated runtime change.
      - run: npm audit --omit=dev --audit-level=high
      - name: Upload desktop frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - name: Install native tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev
      - name: Prepare embedded build fixtures
        shell: bash
        run: |
          mkdir -p cmd/viib/dist cmd/wails/frontend/dist cmd/wails/build .ci
          printf '<!doctype html><title>test fixture</title>' > cmd/viib/dist/index.html
          cp cmd/viib/dist/index.html cmd/wails/frontend/dist/index.html
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > cmd/wails/build/appicon.png
      - name: Run backend validation
        id: backend_checks
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            go test ./...
            go test -race ./...
            go vet ./...
            go install honnef.co/go/tools/cmd/staticcheck@latest
            staticcheck ./...
            go build -o .ci/viib-web ./cmd/viib
            go build -o .ci/viib-wails ./cmd/wails
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck -mode binary .ci/viib-web
            govulncheck -mode binary .ci/viib-wails
          } > ../backend-validation.txt 2>&1
      - name: Upload backend validation log
        if: ${{ steps.backend_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation-log
          path: backend-validation.txt
          retention-days: 7
      - name: Fail unsuccessful backend checks
        if: ${{ steps.backend_checks.outcome == 'failure' }}
        run: exit 1

  semantic-cross-compile:
    name: Semantic foundation (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      # This package compiles the complete foundation dependency closure,
      # including SQLite persistence, without trying to cross-package a native
      # Wails shell. The platform-specific application builds stay in release CI.
      - name: Cross-compile semantic foundation
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build ./internal/semantic/...

  unix-desktop-build:
    name: Desktop build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [frontend, backend, semantic-cross-compile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            expected_arch: x86-64
            archive: ViiB-MediaHub-linux-amd64.tar.gz
          - target: macos-arm64
            runner: macos-15
            platform: darwin/arm64
            expected_arch: arm64
            archive: ViiB-MediaHub-macos-arm64.zip
          - target: macos-amd64
            runner: macos-15-intel
            platform: darwin/amd64
            expected_arch: x86_64
            archive: ViiB-MediaHub-macos-amd64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - name: Install Linux desktop dependencies
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config xvfb libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Download validated frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: desktop-frontend-dist
          path: backend/cmd/wails/frontend/dist
      - name: Prepare Wails package assets
        shell: bash
        run: |
          mkdir -p backend/cmd/wails/build
          cp assets/icons/appicon.png backend/cmd/wails/build/appicon.png
      - name: Build Wails application
        id: wails_build
        continue-on-error: true
        working-directory: backend/cmd/wails
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          set -o pipefail
          if [[ "${{ matrix.target }}" == linux-* ]]; then
            xvfb-run -a wails build -platform "${{ matrix.platform }}" -tags webkit2_41 -ldflags "-s -w" 2>&1 | tee wails-build.log
          else
            wails build -platform "${{ matrix.platform }}" -ldflags "-s -w" 2>&1 | tee wails-build.log
          fi
      - name: Upload Wails build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-wails-build-log
          path: backend/cmd/wails/wails-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify and archive desktop build
        if: steps.wails_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == linux-* ]]; then
            binary="backend/cmd/wails/build/bin/ViiB-MediaHub"
            test -x "$binary"
            file "$binary" | tee package-details.txt
            file "$binary" | grep -q "${{ matrix.expected_arch }}"
            tar -C backend/cmd/wails/build/bin -czf "${{ matrix.archive }}" ViiB-MediaHub
            sha256sum "${{ matrix.archive }}" | tee -a package-details.txt
          else
            app="backend/cmd/wails/build/bin/ViiB-MediaHub.app"
            binary="$app/Contents/MacOS/ViiB-MediaHub"
            test -d "$app"
            test -x "$binary"
            lipo -archs "$binary" | tee package-details.txt
            lipo -archs "$binary" | grep -qw "${{ matrix.expected_arch }}"
            ditto -c -k --sequesterRsrc --keepParent "$app" "${{ matrix.archive }}"
            shasum -a 256 "${{ matrix.archive }}" | tee -a package-details.txt
          fi
      - name: Upload desktop application
        if: steps.wails_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-desktop
          path: |
            ${{ matrix.archive }}
            package-details.txt
          if-no-files-found: error
          retention-days: 14
      - name: Fail unsuccessful Wails build
        if: steps.wails_build.outcome == 'failure'
        run: exit 1

  windows-build:
    runs-on: windows-latest
    needs: [frontend, backend, semantic-cross-compile]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache-dependency-path: backend/go.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run build
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - shell: pwsh
        run: |
          $dest = "backend\cmd\wails\frontend\dist"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path "backend\cmd\wails\frontend" -Force | Out-Null
          Copy-Item -Recurse "dist" $dest
      - name: Build Wails application
        id: wails_build
        continue-on-error: true
        working-directory: backend/cmd/wails
        shell: pwsh
        run: |
          & wails build -platform windows/amd64 -ldflags "-s -w" *>&1 | Tee-Object -FilePath wails-build.log
          exit $LASTEXITCODE
      - name: Upload Wails build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wails-build-log
          path: backend/cmd/wails/wails-build.log
          retention-days: 7
      - name: Fail unsuccessful Wails build
        if: steps.wails_build.outcome == 'failure'
        shell: pwsh
        run: exit 1
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan packaged Windows binary
        shell: pwsh
        run: ./scripts/check-windows-govuln.ps1 -BinaryPath 'backend/cmd/wails/build/bin/ViiB-MediaHub.exe'
