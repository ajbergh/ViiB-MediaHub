name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-remediation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Configure Python
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/full-reliability-remediation' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic remediation
        id: remediation
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/full-reliability-remediation' }}
        shell: bash
        run: |
          python scripts/fix_full_reliability_validation.py
          if [[ -f docs/FULL_RELIABILITY_REMEDIATION_STATUS.md ]]; then
            echo "Remediation implementation is already present; skipping generation."
            exit 0
          fi
          rm -f docs/REMEDIATION_RUN_ERROR.txt
          python scripts/repair_full_reliability_remediation.py
          python scripts/apply_full_reliability_remediation.py > /tmp/remediation.log 2>&1
      - name: Persist remediation diagnostics
        if: ${{ steps.remediation.outcome == 'failure' }}
        shell: bash
        run: |
          cp /tmp/remediation.log /tmp/remediation-preserved.txt
          git reset --hard HEAD
          git clean -fd
          mkdir -p docs
          cp /tmp/remediation-preserved.txt docs/REMEDIATION_RUN_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REMEDIATION_RUN_ERROR.txt
          git commit -m "Record remediation runner failure [skip agent]"
          git push origin HEAD:${{ github.head_ref }}
      - name: Fail unsuccessful remediation
        if: ${{ steps.remediation.outcome == 'failure' }}
        run: exit 1
      - name: Format Go sources
        if: ${{ steps.remediation.outcome == 'success' && github.event_name == 'pull_request' && github.head_ref == 'agent/full-reliability-remediation' }}
        working-directory: backend
        run: gofmt -w internal/api internal/db internal/scanner
      - name: Commit implementation to PR branch
        if: ${{ steps.remediation.outcome == 'success' && github.event_name == 'pull_request' && github.head_ref == 'agent/full-reliability-remediation' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
          else
            git commit -m "Fix reliability remediation validation [skip agent]"
            git push origin HEAD:${{ github.head_ref }}
          fi

  frontend:
    needs: [apply-remediation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run frontend checks
        id: frontend_checks
        continue-on-error: true
        shell: bash
        run: npm run check > frontend-validation.txt 2>&1
      - name: Upload frontend validation log
        if: ${{ steps.frontend_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-log
          path: frontend-validation.txt
          retention-days: 7
      - name: Fail unsuccessful frontend checks
        if: ${{ steps.frontend_checks.outcome == 'failure' }}
        run: exit 1
      - run: npm audit --audit-level=high

  backend:
    needs: [apply-remediation]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          show-progress: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: backend/go.sum
      - name: Install native tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev
      - name: Prepare embedded build fixtures
        shell: bash
        run: |
          mkdir -p cmd/viib/dist cmd/wails/frontend/dist cmd/wails/build .ci
          printf '<!doctype html><title>test fixture</title>' > cmd/viib/dist/index.html
          cp cmd/viib/dist/index.html cmd/wails/frontend/dist/index.html
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > cmd/wails/build/appicon.png
      - name: Run backend validation
        id: backend_checks
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            go test ./...
            go test -race ./...
            go vet ./...
            go install honnef.co/go/tools/cmd/staticcheck@latest
            staticcheck ./...
            go build -o .ci/viib-web ./cmd/viib
            go build -o .ci/viib-wails ./cmd/wails
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck -mode binary .ci/viib-web
            govulncheck -mode binary .ci/viib-wails
          } > ../backend-validation.txt 2>&1
      - name: Upload backend validation log
        if: ${{ steps.backend_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation-log
          path: backend-validation.txt
          retention-days: 7
      - name: Fail unsuccessful backend checks
        if: ${{ steps.backend_checks.outcome == 'failure' }}
        run: exit 1

  windows-build:
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: backend/go.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run build
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - shell: pwsh
        run: |
          $dest = "backend\cmd\wails\frontend\dist"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path "backend\cmd\wails\frontend" -Force | Out-Null
          Copy-Item -Recurse "dist" $dest
      - name: Build Wails application
        id: wails_build
        continue-on-error: true
        working-directory: backend/cmd/wails
        shell: pwsh
        run: |
          & wails build -platform windows/amd64 -ldflags "-s -w" *>&1 | Tee-Object -FilePath wails-build.log
          exit $LASTEXITCODE
      - name: Upload Wails build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wails-build-log
          path: backend/cmd/wails/wails-build.log
          retention-days: 7
      - name: Fail unsuccessful Wails build
        if: steps.wails_build.outcome == 'failure'
        shell: pwsh
        run: exit 1
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan packaged Windows binary
        shell: pwsh
        run: ./scripts/check-windows-govuln.ps1 -BinaryPath 'backend/cmd/wails/build/bin/ViiB-MediaHub.exe'
