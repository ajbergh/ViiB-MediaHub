name: Validate Remediation

on:
  push:
    branches: [agent/full-remediation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Validate frontend
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci
            npm run check
          } 2>&1 | tee frontend-validation.txt
      - name: Capture dependency audit
        shell: bash
        run: npm audit --json > npm-audit.json || true
      - name: Upload frontend diagnostics
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-remediation-diagnostics
          path: |
            frontend-validation.txt
            npm-audit.json
          retention-days: 7
      - name: Fail frontend validation
        if: steps.validate.outcome == 'failure'
        run: exit 1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache-dependency-path: backend/go.sum
      - name: Prepare embed fixtures
        working-directory: backend
        run: |
          mkdir -p cmd/viib/dist cmd/wails/frontend/dist
          printf '<!doctype html><title>test fixture</title>' > cmd/viib/dist/index.html
          cp cmd/viib/dist/index.html cmd/wails/frontend/dist/index.html
      - name: Capture dependency diagnostics
        shell: bash
        run: |
          {
            echo '== amp.SDK v0.705.1 tag =='
            git ls-remote --tags https://github.com/art-media-platform/amp.SDK.git 'refs/tags/v0.705.1*' || true
            echo '== Go proxy lookup =='
            cd backend
            GOPROXY=https://proxy.golang.org go list -m -json github.com/art-media-platform/amp.SDK@v0.705.1 || true
          } > backend-dependency-diagnostics.txt 2>&1
      - name: Validate backend
        id: validate
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          {
            go test ./...
            go vet ./...
          } 2>&1 | tee ../backend-validation.txt
      - name: Upload backend diagnostics
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-remediation-diagnostics
          path: |
            backend-validation.txt
            backend-dependency-diagnostics.txt
          retention-days: 7
      - name: Fail backend validation
        if: steps.validate.outcome == 'failure'
        run: exit 1
