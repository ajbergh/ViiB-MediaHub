name: Validate Remediation

on:
  push:
    branches: [agent/full-remediation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate frontend
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci
            npm run check
          } 2>&1 | tee frontend-validation.txt
      - name: Capture dependency audit
        shell: bash
        run: npm audit --json > npm-audit.json || true
      - name: Upload frontend diagnostics
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-remediation-diagnostics
          path: frontend-validation.txt
          retention-days: 7
      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: npm-audit.json
          retention-days: 7
      - name: Fail frontend validation
        if: steps.validate.outcome == 'failure'
        run: exit 1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache-dependency-path: backend/go.sum
      - name: Install native tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev
      - name: Prepare embed fixtures
        working-directory: backend
        shell: bash
        run: |
          mkdir -p cmd/viib/dist cmd/wails/frontend/dist cmd/wails/build
          printf '<!doctype html><title>test fixture</title>' > cmd/viib/dist/index.html
          cp cmd/viib/dist/index.html cmd/wails/frontend/dist/index.html
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > cmd/wails/build/appicon.png
      - name: Validate backend
        id: validate
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          {
            go test ./...
            go vet ./...
          } 2>&1 | tee ../backend-validation.txt
      - name: Upload backend diagnostics
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-remediation-diagnostics
          path: backend-validation.txt
          retention-days: 7
      - name: Fail backend validation
        if: steps.validate.outcome == 'failure'
        run: exit 1
