name: Apply Full Remediation

on:
  push:
    branches:
      - agent/full-remediation
    paths:
      - scripts/apply_full_remediation.py
      - .github/workflows/apply-remediation.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_full_remediation.py
      - .github/workflows/apply-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viib-full-remediation
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply remediation patches
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply_full_remediation.py 2>&1 | tee remediation-output.txt

      - name: Persist migration diagnostics
        if: steps.apply.outcome == 'failure'
        run: |
          git add -f remediation-output.txt
          git commit -m "Record remediation migration failure [skip remediation]"
          git push origin HEAD:agent/full-remediation

      - name: Stop after migration failure
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Format Go sources
        if: steps.apply.outcome == 'success'
        run: find backend -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Refresh frontend lockfile
        if: steps.apply.outcome == 'success'
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit remediation
        if: steps.apply.outcome == 'success'
        run: |
          rm -f remediation-output.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 0
          fi
          git commit -m "Implement full engineering remediation [skip remediation]"
          git push origin HEAD:agent/full-remediation
