name: Sync Go Version Documentation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0
      - name: Update documented Go baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          replacements = {
              '| Go | 1.22+ | |': '| Go | 1.25.12+ | Security-patched baseline |',
              '- **Go 1.25.2+** — compiled, efficient backend': '- **Go 1.25.12+** — compiled, efficient backend',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing README anchor: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document patched Go baseline"
          git push origin HEAD:agent/full-remediation
