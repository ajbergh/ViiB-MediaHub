name: Release binaries

on:
  push:
    branches: [main]
    paths:
      - '.release-version'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.25.13'
  NODE_VERSION: '24'
  WAILS_VERSION: 'v2.11.0'

jobs:
  prepare:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .release-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing ${tag} from ${GITHUB_SHA}."

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install Linux validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev

      - name: Validate and build frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Prepare backend embeds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/cmd/wails/frontend/dist backend/cmd/viib/dist
          mkdir -p backend/cmd/wails/frontend backend/cmd/viib backend/cmd/wails/build
          cp -R dist backend/cmd/wails/frontend/dist
          cp -R dist backend/cmd/viib/dist
          cp assets/icons/appicon.png backend/cmd/wails/build/appicon.png

      - name: Validate backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

      - name: Upload validated frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Package Linux amd64
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download validated frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: release-frontend-dist
          path: backend/cmd/wails/frontend/dist

      - name: Prepare Wails assets
        run: |
          mkdir -p backend/cmd/wails/build
          cp assets/icons/appicon.png backend/cmd/wails/build/appicon.png

      - name: Build Linux application
        working-directory: backend/cmd/wails
        env:
          CGO_ENABLED: 1
        run: wails build -skipbindings -platform linux/amd64 -tags webkit2_41 -ldflags "-s -w"

      - name: Package DEB and portable archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          binary="backend/cmd/wails/build/bin/ViiB-MediaHub"
          test -x "$binary"
          file "$binary"
          file "$binary" | grep -q 'x86-64'

          deb="ViiB-MediaHub-${VERSION}-linux-amd64.deb"
          portable="ViiB-MediaHub-${VERSION}-linux-amd64.tar.gz"
          root="$RUNNER_TEMP/viib-deb"
          rm -rf "$root"
          mkdir -p \
            "$root/DEBIAN" \
            "$root/opt/viib-mediahub" \
            "$root/usr/bin" \
            "$root/usr/share/applications" \
            "$root/usr/share/icons/hicolor/256x256/apps"

          install -m 0755 "$binary" "$root/opt/viib-mediahub/ViiB-MediaHub"
          ln -s /opt/viib-mediahub/ViiB-MediaHub "$root/usr/bin/viib-mediahub"
          install -m 0644 assets/icons/appicon.png "$root/usr/share/icons/hicolor/256x256/apps/viib-mediahub.png"

          cat > "$root/DEBIAN/control" <<EOF
          Package: viib-mediahub
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: ViiB <noreply@github.com>
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libayatana-appindicator3-1
          Description: ViiB MediaHub desktop audio player
           Native desktop music player with local and connected media sources.
          EOF

          cat > "$root/usr/share/applications/viib-mediahub.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ViiB MediaHub
          Comment=ViiB MediaHub desktop audio player
          Exec=/opt/viib-mediahub/ViiB-MediaHub
          Icon=viib-mediahub
          Terminal=false
          Categories=AudioVideo;Audio;Player;
          EOF

          dpkg-deb --root-owner-group --build "$root" "$deb"
          tar -C backend/cmd/wails/build/bin -czf "$portable" ViiB-MediaHub
          sha256sum "$deb" "$portable"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: |
            ViiB-MediaHub-${{ needs.prepare.outputs.version }}-linux-amd64.deb
            ViiB-MediaHub-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Package macOS (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            platform: darwin/arm64
          - arch: x64
            runner: macos-15-intel
            platform: darwin/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download validated frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: release-frontend-dist
          path: backend/cmd/wails/frontend/dist

      - name: Prepare Wails assets
        run: |
          mkdir -p backend/cmd/wails/build
          cp assets/icons/appicon.png backend/cmd/wails/build/appicon.png

      - name: Build macOS application
        working-directory: backend/cmd/wails
        env:
          CGO_ENABLED: 1
        run: wails build -skipbindings -platform "${{ matrix.platform }}" -ldflags "-s -w"

      - name: Package DMG
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app="backend/cmd/wails/build/bin/ViiB-MediaHub.app"
          binary="$app/Contents/MacOS/ViiB-MediaHub"
          test -d "$app"
          test -x "$binary"
          lipo -archs "$binary"

          if [[ "$ARCH" == 'arm64' ]]; then
            lipo -archs "$binary" | grep -qw arm64
          else
            lipo -archs "$binary" | grep -qw x86_64
          fi

          # Ad-hoc signing preserves bundle integrity for this unsigned RC.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          stage="$RUNNER_TEMP/viib-dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$app" "$stage/ViiB MediaHub.app"
          ln -s /Applications "$stage/Applications"

          dmg="ViiB-MediaHub-${VERSION}-macos-${ARCH}.dmg"
          hdiutil create \
            -volname "ViiB MediaHub ${VERSION}" \
            -srcfolder "$stage" \
            -ov \
            -format UDZO \
            "$dmg"
          shasum -a 256 "$dmg"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: ViiB-MediaHub-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Package Windows x64 installer
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: echo 'C:\msys64\mingw64\bin' >> $env:GITHUB_PATH

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          choco install nsis -y --no-progress

      - name: Download validated frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: release-frontend-dist
          path: backend/cmd/wails/frontend/dist

      - name: Prepare Wails assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'backend\cmd\wails\build' -Force | Out-Null
          Copy-Item 'assets\icons\appicon.png' 'backend\cmd\wails\build\appicon.png' -Force

      - name: Build Windows application
        working-directory: backend/cmd/wails
        shell: pwsh
        env:
          CGO_ENABLED: 1
        run: wails build -skipbindings -platform windows/amd64 -ldflags '-s -w'

      - name: Install govulncheck
        shell: pwsh
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan packaged Windows binary
        shell: pwsh
        run: ./scripts/check-windows-govuln.ps1 -BinaryPath 'backend/cmd/wails/build/bin/ViiB-MediaHub.exe'

      - name: Stage Windows application and runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Resolve-Path 'backend\cmd\wails\build\bin\ViiB-MediaHub.exe'
          $stage = Join-Path $env:RUNNER_TEMP 'viib-windows-stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $binary $stage

          $dependencyText = (& objdump -p $binary | Out-String)
          Write-Host $dependencyText
          $dllNames = [regex]::Matches($dependencyText, 'DLL Name:\s+([^\r\n]+)') |
            ForEach-Object { $_.Groups[1].Value.Trim() } |
            Sort-Object -Unique

          foreach ($dll in $dllNames) {
            $mingwDll = Join-Path 'C:\msys64\mingw64\bin' $dll
            if (Test-Path $mingwDll) {
              Write-Host "Bundling MinGW runtime DLL: $dll"
              Copy-Item $mingwDll $stage -Force
            }
          }

          Get-ChildItem $stage

      - name: Sign Windows application when credentials are configured
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CERT_PFX)) {
            Write-Host 'Windows signing certificate not configured; continuing with unsigned RC binary.'
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'viib-code-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_PFX))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\signtool.exe' } |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /f $certPath /p $env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$env:RUNNER_TEMP\viib-windows-stage\ViiB-MediaHub.exe"

      - name: Build NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'viib-windows-stage'
          $installer = Join-Path $PWD "ViiB-MediaHub-$env:VERSION-windows-x64-setup.exe"
          $script = Join-Path $env:RUNNER_TEMP 'viib-installer.nsi'

          $nsi = @'
          Unicode True
          Name "ViiB MediaHub"
          OutFile "__OUTFILE__"
          InstallDir "$LOCALAPPDATA\Programs\ViiB MediaHub"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma

          Page directory
          Page instfiles
          UninstPage uninstConfirm
          UninstPage instfiles

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "__STAGE__\*.*"
            CreateDirectory "$SMPROGRAMS\ViiB MediaHub"
            CreateShortCut "$SMPROGRAMS\ViiB MediaHub\ViiB MediaHub.lnk" "$INSTDIR\ViiB-MediaHub.exe"
            CreateShortCut "$DESKTOP\ViiB MediaHub.lnk" "$INSTDIR\ViiB-MediaHub.exe"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\ViiB MediaHub" "DisplayName" "ViiB MediaHub"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\ViiB MediaHub" "DisplayVersion" "__VERSION__"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\ViiB MediaHub" "Publisher" "ViiB"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\ViiB MediaHub" "UninstallString" "$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\ViiB MediaHub.lnk"
            RMDir /r "$SMPROGRAMS\ViiB MediaHub"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\ViiB MediaHub"
            RMDir /r "$INSTDIR"
          SectionEnd
          '@

          $nsi = $nsi.Replace('__OUTFILE__', $installer).Replace('__STAGE__', $stage).Replace('__VERSION__', $env:VERSION)
          Set-Content -Path $script -Value $nsi -Encoding UTF8

          $makensis = Get-ChildItem 'C:\Program Files (x86)\NSIS' -Filter makensis.exe -Recurse | Select-Object -First 1
          if (-not $makensis) { throw 'makensis.exe not found' }
          & $makensis.FullName $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $installer)) { throw "Installer not created: $installer" }
          Get-Item $installer

      - name: Sign Windows installer when credentials are configured
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CERT_PFX)) {
            Write-Host 'Windows signing certificate not configured; continuing with unsigned RC installer.'
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'viib-code-signing.pfx'
          if (-not (Test-Path $certPath)) {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_PFX))
          }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\signtool.exe' } |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /f $certPath /p $env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "ViiB-MediaHub-$env:VERSION-windows-x64-setup.exe"

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: ViiB-MediaHub-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "ViiB-MediaHub-${VERSION}-windows-x64-setup.exe"
            "ViiB-MediaHub-${VERSION}-macos-arm64.dmg"
            "ViiB-MediaHub-${VERSION}-macos-x64.dmg"
            "ViiB-MediaHub-${VERSION}-linux-amd64.deb"
            "ViiB-MediaHub-${VERSION}-linux-amd64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ViiB MediaHub ${VERSION} is the first 1.0 release candidate.

          ### Installers
          - **Windows 10/11 x64:** `ViiB-MediaHub-${VERSION}-windows-x64-setup.exe`
          - **macOS Apple Silicon:** `ViiB-MediaHub-${VERSION}-macos-arm64.dmg`
          - **macOS Intel:** `ViiB-MediaHub-${VERSION}-macos-x64.dmg`
          - **Ubuntu/Debian x64:** `ViiB-MediaHub-${VERSION}-linux-amd64.deb`
          - **Generic Linux x64:** `ViiB-MediaHub-${VERSION}-linux-amd64.tar.gz`

          `SHA256SUMS.txt` contains checksums for every downloadable binary.

          ### Release-candidate notes
          - macOS packages are ad-hoc signed but not Apple-notarized in this RC, so Gatekeeper may require **Open Anyway** on first launch.
          - Windows binaries/installers are Authenticode-signed only when repository signing credentials are configured; otherwise Windows SmartScreen may warn for this RC.
          - The Linux package targets WebKitGTK 4.1 and Debian/Ubuntu-family distributions; the tarball is provided as a portable fallback for other x86-64 distributions with compatible GTK/WebKitGTK libraries.
          EOF

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

          prerelease_flag=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag+=(--prerelease)
          fi

          gh release create "$TAG" \
            release-assets/* \
            --target "$GITHUB_SHA" \
            --title "ViiB MediaHub $TAG" \
            --notes-file release-notes.md \
            "${prerelease_flag[@]}"

      - name: Verify published release
        shell: bash
        run: |
          gh release view "$TAG" --json tagName,name,isPrerelease,url,assets
