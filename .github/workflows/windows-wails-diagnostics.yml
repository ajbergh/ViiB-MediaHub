name: Windows Dependency Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: backend/go.sum
      - name: Trace OpenPGP import chain
        working-directory: backend
        shell: pwsh
        run: |
          go mod why golang.org/x/crypto/openpgp *>&1 | Tee-Object -FilePath openpgp-why.txt
          go list -deps -f '{{.ImportPath}}|{{join .Imports ","}}' ./cmd/wails *>&1 | Select-String 'golang.org/x/crypto/openpgp' | Set-Content openpgp-importers.txt
          go mod graph | Select-String 'golang.org/x/crypto' | Set-Content xcrypto-graph.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dependency-diagnostics
          path: |
            backend/openpgp-why.txt
            backend/openpgp-importers.txt
            backend/xcrypto-graph.txt
          retention-days: 7
