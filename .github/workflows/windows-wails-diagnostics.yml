name: Upgrade XCrypto Security Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: backend/go.sum
      - name: Install native tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev
      - name: Upgrade xcrypto
        working-directory: backend
        run: |
          go get golang.org/x/crypto@v0.52.0
          go mod tidy
      - name: Prepare embedded fixtures
        working-directory: backend
        run: |
          mkdir -p cmd/viib/dist cmd/wails/frontend/dist cmd/wails/build
          printf '<!doctype html><title>test fixture</title>' > cmd/viib/dist/index.html
          cp cmd/viib/dist/index.html cmd/wails/frontend/dist/index.html
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > cmd/wails/build/appicon.png
      - name: Validate dependency update
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/go.mod backend/go.sum
          git commit -m "Upgrade xcrypto security baseline"
          git push origin HEAD:agent/full-remediation
