name: Restore API Handler

on:
  push:
    branches: [agent/full-remediation]
    paths:
      - .github/workflows/restore-api-file.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-remediation
          fetch-depth: 0
      - name: Restore and patch API handler
        shell: bash
        run: |
          git checkout f2213e4e4cbc91b45140a0362bc63b7091e3d80a -- backend/internal/api/api.go
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/api/api.go')
          text = path.read_text()
          text = text.replace('logger.Debug("FE: %s", fullMessage)', 'logger.Debug("FE", "%s", fullMessage)')
          text = text.replace('logger.Log("FE: %s", fullMessage)', 'logger.Log("FE", "%s", fullMessage)')
          text = text.replace('logger.Log("FE WARN: %s", fullMessage)', 'logger.Log("FE WARN", "%s", fullMessage)')
          text = text.replace('logger.Log("FE ERROR: %s", fullMessage)', 'logger.Log("FE ERROR", "%s", fullMessage)')
          path.write_text(text)
          PY
          gofmt -w backend/internal/api/api.go
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/api/api.go
          git commit -m "Restore API handlers and fix logger calls"
          git push origin HEAD:agent/full-remediation
