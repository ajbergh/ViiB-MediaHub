<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              surface: {
                0: '#000000',
                1: '#121212',
                2: '#181818',
                3: '#282828',
                highlight: '#1e1e1e',
                hover: '#2a2a2a',
                border: '#333333',
                slider: '#404040'
              },
              text: {
                main: '#ffffff',
                secondary: '#b3b8c1',
                subtle: '#6f7480'
              },
              brand: {
                DEFAULT: '#1db954',
                hover: '#1ed760'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #ffffff;
        overflow: hidden; /* App-like feel */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #121212; 
      }
      ::-webkit-scrollbar-thumb {
        background: #404040; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "zustand": "https://aistudiocdn.com/zustand@^5.0.8",
    "music-metadata": "https://esm.sh/music-metadata@10.0.0?bundle",
    "buffer": "https://esm.sh/buffer@5.7.1",
    "zustand/": "https://aistudiocdn.com/zustand@^5.0.8/",
    "react-virtuoso": "https://esm.sh/react-virtuoso@4.12.3?external=react,react-dom",
    "idb": "https://esm.sh/idb@8.0.0"
  }
}
</script>
<script>
    // Polyfill Buffer just in case, though music-metadata v10 shouldn't need it.
    import('buffer').then(module => {
        window.Buffer = module.Buffer;
    });
</script>
</head>

    <div id="root"></div>
  </body>
</html>
