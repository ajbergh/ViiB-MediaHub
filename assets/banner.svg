  <g clip-path="url(#bannerClip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#fineGrid)"/>

    <path d="M0 264C118 230 238 228 358 260C493 296 593 311 724 276C858 240 985 246 1200 292V360H0Z" fill="#18181e" opacity="0.66"/>
    <path d="M0 286C148 252 280 255 424 290C553 322 654 327 783 290C915 252 1042 260 1200 309V360H0Z" fill="url(#ribbon)"/>
    <path d="M63 112C173 72 306 69 445 97C585 126 714 132 853 101C983 72 1095 77 1212 111" fill="none" stroke="url(#brand)" stroke-width="1.4" opacity="0.34"/>
    <path d="M-20 148C128 100 297 106 466 145C615 180 755 187 908 145C1040 109 1135 124 1220 158" fill="none" stroke="url(#cool)" stroke-width="1" opacity="0.21"/>

    <rect x="1.5" y="1.5" width="1197" height="357" rx="24.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#brand)" opacity="0.88"/>
    <rect x="0" y="356" width="1200" height="4" fill="url(#brand)" opacity="0.36"/>

    <g transform="translate(66 55)" filter="url(#cardShadow)">
      <rect width="238" height="238" rx="46" fill="#050508"/>
      <rect x="1.5" y="1.5" width="235" height="235" rx="44.5" fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="3"/>
