<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">ViiB MediaHub</title>
  <desc id="desc">ViiB MediaHub README banner with the vector app icon, audio waveform, and local-first desktop music player branding.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08080c"/>
      <stop offset="0.48" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#101017"/>
    </linearGradient>

    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#6d4dff"/>
      <stop offset="0.44" stop-color="#9b5cff"/>
      <stop offset="0.76" stop-color="#d63ca6"/>
      <stop offset="1" stop-color="#ff4f87"/>
    </linearGradient>

    <linearGradient id="brandVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#ff4f87"/>
      <stop offset="0.45" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#5e49f2"/>
    </linearGradient>

    <linearGradient id="cool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#3ee089"/>
      <stop offset="1" stop-color="#4ea1ff"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0" y1="260" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e49f2" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#d63ca6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ee089" stop-opacity="0.16"/>
    </linearGradient>

    <radialGradient id="iconLight" cx="45%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.52" stop-color="#9b5cff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardShadow" x="-18%" y="-18%" width="136%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="markGlow" x="-28%" y="-28%" width="156%" height="156%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.55 0 0 0 0.38  0 0.35 0 0 0.14  0 0 0.9 0 0.95  0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="lineGlow" x="-8%" y="-60%" width="116%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="fineGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.026" stroke-width="1"/>
    </pattern>

    <clipPath id="bannerClip">
      <rect width="1200" height="360" rx="26"/>
    </clipPath>

