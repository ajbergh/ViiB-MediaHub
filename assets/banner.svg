    </g>

    <g font-family="'Segoe UI', Inter, 'SF Pro Display', Arial, sans-serif">
      <text x="350" y="88" font-size="14" font-weight="750" letter-spacing="3" fill="#9b5cff">LOCAL-FIRST DESKTOP PLAYER</text>
      <text x="348" y="164" font-size="72" font-weight="850" letter-spacing="0" fill="url(#brand)">ViiB</text>
      <text x="516" y="164" font-size="52" font-weight="430" letter-spacing="0" fill="#f7f5ff">MediaHub</text>
      <text x="352" y="207" font-size="22" font-weight="500" letter-spacing="0" fill="#c7c5d4">A fast, private music hub for your local library.</text>
      <text x="352" y="238" font-size="16" font-weight="500" letter-spacing="0" fill="#868999">AI DJ, visualizers, smart playlists, and native builds.</text>
    </g>

    <g transform="translate(350 268)" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700">
