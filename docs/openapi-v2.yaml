openapi: 3.1.0
info:
  title: ViiB MediaHub Local API
  version: 2.1.0
  description: >-
    Local-only API for revisioned library synchronization, indexed search,
    performance diagnostics, durable jobs, library maintenance, and Plex Media
    Server music-source configuration. Every response includes `X-Request-ID`.
    Jobs, Library Operations, and Plex configuration return the documented
    machine-readable error envelope; legacy library and performance handlers
    retain their existing response shape for compatibility. Plex credentials
    are never returned by this API.
servers:
  - url: /api/v2
paths:
  /library/snapshot:
    get:
      operationId: getLibrarySnapshot
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        '200':
          description: Cursor-based library page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibrarySnapshotPage' }
  /library/changes:
    get:
      operationId: getLibraryChanges
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        '200':
          description: Ordered durable changes after the supplied revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryChangePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /library/revision:
    get:
      operationId: getLibraryRevision
      responses:
        '200':
          description: Current library revision
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { type: integer, minimum: 0 }
  /library/events:
    get:
      operationId: streamLibraryRevisions
      parameters:
        - { name: since, in: query, schema: { type: integer, minimum: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        '200':
          description: Server-sent library_revision events with heartbeats
          content:
            text/event-stream: { schema: { type: string } }
  /library/stats:
    get:
      operationId: getLibrarySyncStats
      responses:
        '200':
          description: Current revision and retained change-log count
          content:
            application/json:
              schema:
                type: object
                required: [revision, retainedChanges]
                properties:
                  revision: { type: integer, minimum: 0 }
                  retainedChanges: { type: integer, minimum: 0 }
  /search:
    get:
      operationId: searchLibrary
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 250 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Categorized local library search result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibrarySearchResult' }
  /plex/discover:
    post:
      operationId: discoverPlexServers
      summary: Perform one bounded Plex GDM LAN discovery request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeoutMs: { type: integer, minimum: 1, maximum: 10000, default: 1500 }
      responses:
        '200':
          description: Discovered Plex Media Servers; an empty array is valid when GDM is disabled or blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlexDiscoveryResult' }
  /plex/connect:
    post:
      operationId: connectPlexServer
      summary: Validate and save a Plex Media Server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: Bare host/IP or complete HTTP(S) Plex server URL. Bare hosts default to port 32400.
      responses:
        '200':
          description: Validated Plex server identity. No token is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlexServer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /plex/config:
    get:
      operationId: getPlexConfiguration
      responses:
        '200':
          description: Current browser-safe Plex source configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlexConfig' }
    delete:
      operationId: disconnectPlexSource
      summary: Remove the Plex source from ViiB only
      description: Deletes ViiB cached Plex catalog/configuration and encrypted Plex credentials. It never deletes or modifies media on the Plex server.
      responses:
        '200':
          description: Plex source removed from ViiB
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: removed }
        '500': { $ref: '#/components/responses/InternalError' }
  /plex/auth/start:
    post:
      operationId: startPlexAuthentication
      summary: Begin Plex JWT/PIN device authentication
      responses:
        '200':
          description: Browser-safe Plex authorization URL and expiration. PIN/device private-key material is not returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlexAuthStart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /plex/auth/status:
    get:
      operationId: getPlexAuthenticationStatus
      summary: Poll the pending Plex JWT/PIN authentication flow
      responses:
        '200':
          description: Authentication state. Tokens are not returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlexAuthStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /plex/libraries:
    get:
      operationId: listPlexMusicLibraries
      summary: List selectable music/audio libraries from the configured Plex server
      description: Movie, TV, photo, clip/music-video, and other non-audio libraries are excluded.
      responses:
        '200':
          description: Music/audio libraries only
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items: { $ref: '#/components/schemas/PlexLibrary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /plex/library:
    put:
      operationId: selectPlexMusicLibrary
      summary: Select the Plex music library used by ViiB
      description: Changing the selected library removes only ViiB cached records from the previous Plex library. No Plex media is modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId]
              properties:
                libraryId: { type: string }
      responses:
        '200':
          description: Selected music library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlexLibrary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /plex/sync:
    post:
      operationId: synchronizePlexMusicLibrary
      summary: Start an explicit Plex music-library synchronization
      responses:
        '200':
          description: Synchronization started
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: started }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plex/sync/status:
    get:
      operationId: getPlexSyncStatus
      responses:
        '200':
          description: Current Plex source and synchronization state
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source:
                    oneOf:
                      - { $ref: '#/components/schemas/PlexSource' }
                      - { type: 'null' }
  /jobs/:
    get:
      operationId: listJobs
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Operation jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    post:
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [full_scan, quick_scan, refresh_genre_stats] }
                parameters: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /jobs/events:
    get:
      operationId: streamJobs
      responses:
        '200':
          description: Server-sent job snapshots
          content:
            text/event-stream: { schema: { type: string } }
  /jobs/{id}:
    get:
      operationId: getJob
      parameters:
        - { $ref: '#/components/parameters/JobID' }
      responses:
        '200':
          description: Operation job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - { $ref: '#/components/parameters/JobID' }
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Conflict' }
  /jobs/{id}/retry:
    post:
      operationId: retryJob
      parameters:
        - { $ref: '#/components/parameters/JobID' }
      responses:
        '202':
          description: Retry job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Conflict' }
  /performance/:
    get:
      operationId: getPerformanceDiagnostics
      responses:
        '200':
          description: Local scanner, database, and synchronization metrics
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /performance/scanner-failures:
    get:
      operationId: listScannerFailures
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 250 } }
      responses:
        '200':
          description: Files temporarily quarantined after metadata extraction failures
          content:
            application/json:
              schema:
                type: object
                required: [failures]
                properties:
                  failures:
                    type: array
                    items: { $ref: '#/components/schemas/ScannerFailure' }
    delete:
      operationId: clearScannerFailure
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Quarantine entry removed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: cleared }
  /operations/diagnostics:
    get:
      operationId: getLibraryDiagnostics
      responses:
        '200':
          description: Read-only local library diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryDiagnostics' }
        '500': { $ref: '#/components/responses/InternalError' }
  /operations/repair:
    post:
      operationId: repairLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [removeMissing]
              properties:
                removeMissing:
                  type: boolean
                  description: Also remove database records for diagnostics-confirmed missing local media; never deletes files and never treats Plex remote URIs as filesystem paths.
      responses:
        '200':
          description: Search-index and playlist-reference repair results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /operations/songs/{id}/metadata:
    patch:
      operationId: updateDatabaseSongMetadata
      parameters:
        - { $ref: '#/components/parameters/SongID' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                artist: { type: string }
                album: { type: string }
                albumArtist: { type: string }
                trackNumber: { type: integer, minimum: 0 }
                discNumber: { type: integer, minimum: 0 }
                genre: { type: array, items: { type: string } }
                year: { type: integer, minimum: 0, maximum: 3000 }
                writeBack:
                  type: boolean
                  description: Must be false or omitted. Source-file/Plex metadata write-back is not available in this build.
      responses:
        '200':
          description: Updated ViiB database metadata; source media and Plex metadata are unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Song' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /operations/backups:
    get:
      operationId: listBackups
      responses:
        '200':
          description: Available local backup archives
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups:
                    type: array
                    items: { $ref: '#/components/schemas/BackupInfo' }
    post:
      operationId: createBackup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: Optional ZIP filename. Unsafe characters are normalized. }
      responses:
        '201':
          description: Validated SQLite backup archive created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /operations/restore/preview:
    post:
      operationId: previewRestore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Archive checksum and SQLite integrity are valid; no data changed
          content:
            application/json:
              schema:
                type: object
                required: [valid, manifest, restartRequired]
                properties:
                  valid: { type: boolean, example: true }
                  restartRequired: { type: boolean, example: true }
                  manifest: { $ref: '#/components/schemas/BackupManifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /operations/restore/stage:
    post:
      operationId: stageRestore
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '202':
          description: Validated database staged for offline activation by viib-restore
          content:
            application/json:
              schema:
                type: object
                required: [staged, restartRequired, path]
                properties:
                  staged: { type: boolean, example: true }
                  restartRequired: { type: boolean, example: true }
                  path: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /operations/watcher:
    get:
      operationId: getContinuousWatcherStatus
      responses:
        '200':
          description: Continuous-monitoring state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatcherStatus' }
  /operations/watcher/start:
    post:
      operationId: startContinuousWatcher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intervalMs]
              properties:
                intervalMs: { type: integer, minimum: 2000, maximum: 3600000 }
      responses:
        '200':
          description: Continuous watcher started, or its existing status when already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatcherStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /operations/watcher/stop:
    post:
      operationId: stopContinuousWatcher
      responses:
        '200':
          description: Continuous watcher stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatcherStatus' }
components:
  parameters:
    JobID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SongID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication is required or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadGateway:
      description: Upstream Plex Media Server/service could not satisfy the request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    GatewayTimeout:
      description: Upstream Plex Media Server timed out
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Local operation failed and may be retried when `error.retryable` is true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotImplemented:
      description: Requested capability is deliberately unavailable in this build
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Song:
      type: object
      required: [id, title, artist, album, duration, filePath, addedAt]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        album: { type: string }
        albumArtist: { type: string }
        trackNumber: { type: integer }
        discNumber: { type: integer }
        genre: { type: array, items: { type: string } }
        year: { type: integer }
        originalYear: { type: integer }
        duration: { type: number }
        replayGainDb: { type: number }
        replayPeak: { type: number }
        filePath: { type: string, description: Browser playback URL; Plex tokens are never embedded. }
        coverPath: { type: string, description: Browser artwork URL; authenticated Plex artwork is proxied by ViiB. }
        addedAt: { type: integer }
        playCount: { type: integer }
        lastPlayed: { type: integer }
        fileHash: { type: string }
        liked: { type: boolean }
        likedAt: { type: integer }
      additionalProperties: true
    LibrarySnapshotPage:
      type: object
      required: [revision, songs, hasMore]
      properties:
        revision: { type: integer }
        songs: { type: array, items: { $ref: '#/components/schemas/Song' } }
        nextCursor: { type: string }
        hasMore: { type: boolean }
    LibraryChange:
      type: object
      required: [revision, songId, operation, changedAt]
      properties:
        revision: { type: integer }
        songId: { type: string }
        operation: { type: string, enum: [upsert, delete] }
        changedAt: { type: integer }
    LibraryChangePage:
      type: object
      required: [fromRevision, toRevision, changes, songs, hasMore]
      properties:
        fromRevision: { type: integer }
        toRevision: { type: integer }
        changes: { type: array, items: { $ref: '#/components/schemas/LibraryChange' } }
        songs: { type: array, items: { $ref: '#/components/schemas/Song' } }
        hasMore: { type: boolean }
    LibrarySearchResult:
      type: object
      required: [query, tracks, albums, artists, playlists]
      properties:
        query: { type: string }
        tracks: { type: array, items: { $ref: '#/components/schemas/Song' } }
        albums: { type: array, items: { type: object, additionalProperties: true } }
        artists: { type: array, items: { type: object, additionalProperties: true } }
        playlists: { type: array, items: { type: object, additionalProperties: true } }
    PlexServer:
      type: object
      required: [name, host, port, scheme, url, machineIdentifier, claimed, authRequired]
      properties:
        name: { type: string }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        scheme: { type: string, enum: [http, https] }
        url: { type: string }
        machineIdentifier: { type: string }
        version: { type: string }
        claimed: { type: boolean }
        authRequired: { type: boolean }
      description: Browser-safe PMS identity. No Plex access token is included.
    PlexSource:
      type: object
      required: [id, machineIdentifier, baseUrl, name, connectedAt, lastSyncStatus, available, active]
      properties:
        id: { type: string }
        machineIdentifier: { type: string }
        baseUrl: { type: string }
        name: { type: string }
        version: { type: string }
        libraryId: { type: string }
        libraryTitle: { type: string }
        connectedAt: { type: integer, description: Unix milliseconds }
        lastSyncAt: { type: integer, description: Unix milliseconds for the most recent sync attempt/completion state update }
        lastSyncStatus: { type: string, enum: [never, running, complete, error, auth_required] }
        lastSyncError: { type: string, description: Redacted status/error message; never contains a Plex credential. }
        available: { type: boolean }
        active: { type: boolean }
      description: Browser-safe ViiB Plex source configuration. Authentication material is stored separately and is never serialized here.
    PlexLibrary:
      type: object
      required: [id, title, type]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string, enum: [artist, music, audio] }
        contentKey: { type: string }
        trackKey: { type: string }
      description: Selectable Plex music/audio library. Video/clip libraries are excluded.
    PlexConfig:
      type: object
      required: [source, authenticated]
      properties:
        source:
          oneOf:
            - { $ref: '#/components/schemas/PlexSource' }
            - { type: 'null' }
        authenticated: { type: boolean }
      description: No Plex token or private device key is returned.
    PlexDiscoveryResult:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: '#/components/schemas/PlexServer' }
        warning: { type: string, description: Non-fatal discovery warning; manual configuration remains available. }
    PlexAuthStart:
      type: object
      required: [authUrl, expiresAt]
      properties:
        authUrl: { type: string, description: Official Plex authorization URL. }
        expiresAt: { type: integer, description: Unix seconds }
    PlexAuthStatus:
      type: object
      required: [authenticated, pending]
      properties:
        authenticated: { type: boolean }
        pending: { type: boolean }
        expiresAt: { type: integer, description: Unix seconds }
        message: { type: string }
      description: Authentication status only. Plex JWT/access tokens are never returned.
    Job:
      type: object
      required: [id, type, status, progressCurrent, progressTotal, attempts, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceling, canceled, interrupted] }
        progressCurrent: { type: integer }
        progressTotal: { type: integer }
        message: { type: string }
        parameters: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        errorCode: { type: string }
        errorMessage: { type: string }
        attempts: { type: integer }
        createdAt: { type: integer }
        startedAt: { type: integer }
        completedAt: { type: integer }
        updatedAt: { type: integer }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
    BackupInfo:
      type: object
      required: [name, size, createdAt]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 0 }
        createdAt: { type: integer, description: Unix milliseconds }
    BackupManifest:
      type: object
      required: [format, version, createdAt, databaseFile, databaseSha256]
      properties:
        format: { type: string, enum: [viib-mediahub-backup] }
        version: { type: integer, enum: [1] }
        createdAt: { type: integer, description: Unix milliseconds }
        databaseFile: { type: string, enum: [library.db] }
        databaseSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        appVersion: { type: string }
    RestoreRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Name of an existing ZIP backup archive; directory components are rejected.
    WatcherStatus:
      type: object
      required: [running, intervalMs, lastChanges, checks]
      properties:
        running: { type: boolean }
        intervalMs: { type: integer, minimum: 0 }
        lastCheckAt: { type: integer, description: Unix milliseconds }
        lastChanges: { type: integer, minimum: 0 }
        lastError: { type: string }
        checks: { type: integer, minimum: 0 }
    ScannerFailure:
      type: object
      required: [filePath, failureKind, message, attempts, firstSeenAt, lastSeenAt, retryAfter]
      properties:
        filePath: { type: string }
        failureKind: { type: string }
        message: { type: string }
        attempts: { type: integer, minimum: 1 }
        firstSeenAt: { type: integer, description: Unix milliseconds }
        lastSeenAt: { type: integer, description: Unix milliseconds }
        retryAfter: { type: integer, description: Unix milliseconds }
    MissingMedia:
      type: object
      required: [songId, title, filePath, reason]
      properties:
        songId: { type: string }
        title: { type: string }
        filePath: { type: string }
        reason: { type: string }
    BrokenPlaylistReference:
      type: object
      required: [playlistId, playlistName, songId]
      properties:
        playlistId: { type: string }
        playlistName: { type: string }
        songId: { type: string }
    LibraryDiagnostics:
      type: object
      required: [checkedAt, integrity, songCount, searchIndexCount, revision, retainedChanges, missingMedia, brokenPlaylistReferences, scannerFailures]
      properties:
        checkedAt: { type: integer, description: Unix milliseconds }
        integrity: { type: string, example: ok }
        songCount: { type: integer, minimum: 0 }
        searchIndexCount: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 0 }
        retainedChanges: { type: integer, minimum: 0 }
        missingMedia: { type: array, items: { $ref: '#/components/schemas/MissingMedia' } }
        brokenPlaylistReferences: { type: array, items: { $ref: '#/components/schemas/BrokenPlaylistReference' } }
        scannerFailures: { type: array, items: { $ref: '#/components/schemas/ScannerFailure' } }
